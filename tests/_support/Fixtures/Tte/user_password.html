  Inti yang dikunci fixture ini: hidden _method=PUT. Reset kata sandi berhasil

<div class="card card-warning">
  <div class="card-header">
    <h3 class="card-title">Ubah Kata Sandi</h3>
  </div>

  <form class="form-horizontal" action="https://tte.magelangkab.go.id/users/password" method="post">
    <input type="hidden" name="csrf_token_tte" value="53cff9f0f63c0730567072da4370271c9a04275f8f5b9c2e595aaf32fc87bf6b" />
    <input type="hidden" name="_method" value="PUT" />
    <input type="hidden" name="id" value="8250" />

    <div class="card-body">
      <div class="form-group row">
        <label for="inputEmail3" class="col-sm-2 col-form-label">Kata sandi baru</label>
        <div class="col-sm-10">
          <input type="password" name="password" class="form-control" id="inputEmail3" placeholder="Kata sandi baru">
          <span class="error invalid-feedback"></span>
        </div>
      </div>
      <div class="form-group row">
        <label for="inputPassword3" class="col-sm-2 col-form-label">Konfirmasi kata sandi</label>
        <div class="col-sm-10">
          <input type="password" name="confirmPassword" class="form-control" id="inputPassword3" placeholder="Konfirmasi kata sandi">
          <span class="error invalid-feedback"></span>
        </div>
      </div>
    </div>

    <div class="card-footer">
      <button type="submit" class="btn btn-danger">Ubah Kata Sandi</button>
    </div>

  </form>
</div>
